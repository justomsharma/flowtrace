# Alternative to FalkorDB Cloud's free tier (which has no TLS): FalkorDB on Fly's private network only. With no
# public service it is reachable only from the app (flowtrace-db.internal:6379) over Fly's WireGuard-encrypted 6PN
# network, and it keeps the graph on a volume. Then set the app's FALKORDB_HOST=flowtrace-db.internal,
# FALKORDB_PORT=6379 and FALKORDB_PASSWORD, and no FALKORDB_USERNAME.
#
#   fly apps create flowtrace-db
#   fly volumes create falkordb_data --size 1 --region sin -a flowtrace-db
#   fly secrets set -a flowtrace-db REDIS_ARGS="--appendonly yes --appendfsync everysec --requirepass <password>"
#   fly deploy -c deploy/falkordb/fly.toml
app = "flowtrace-db"
primary_region = "sin"

[build]
  image = "falkordb/falkordb:6.0.2"

[env]
  FALKORDB_ARGS = "THREAD_COUNT 2 TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 15000"

[mounts]
  source = "falkordb_data"      # the demo graph survives restarts (append-only file)
  destination = "/var/lib/falkordb/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
