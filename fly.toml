# Fly.io: the public demo (fly deploy, from a clean git checkout). Secrets (fly secrets set): FALKORDB_PASSWORD,
# OPENAI_API_KEY, APPROVER_TOKEN. The graph is the flowtrace-db app on Fly's private network (deploy/falkordb).
# See docs/deploy.md.
app = "flowtrace-demo"
primary_region = "iad"          # next to flowtrace-db: every query crosses this link

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_MODE = "1"
  GRAPH_NAME = "flowtrace"
  LLM_PROVIDER = "openai"
  AGENT_MODEL = "gpt-6-luna"
  PUBLIC_HOSTS = "flowtrace-demo.fly.dev"
  FALKORDB_HOST = "flowtrace-db.internal"   # private network (WireGuard), never the internet
  FALKORDB_PORT = "6379"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # always on: a judge's first click should not wait for a cold start
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "flowtrace_runs"     # uploads, investigations and hold plans survive a restart
  destination = "/app/data/runs"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
